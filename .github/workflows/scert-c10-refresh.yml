name: SCERT Class 10 English Official PDF Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - 'scert/refresh/class-10'

permissions:
  contents: write

jobs:
  refresh_class10_english:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf requests

      - name: Run Cloud Edition Refresh Script
        run: |
          python scripts/cloud_runner_refresh_c10.py

      - name: Verify Git Safety & Check Modified Files
        run: |
          git status --short
          git diff --stat

      - name: Commit and Push English Page PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add english/ docs/refresh_evidence/
          git commit -m "feat(scert): refresh official PDF pages for English [224 pages]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
